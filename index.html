<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALI RAZA SIM DATABASE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with Theme Toggle -->
        <div class="header-wrapper">
            <div class="header">
                <h1>ALI RAZA SIM DATABASE</h1>
                <p>Search phone numbers and CNIC records instantly</p>
            </div>
            <div class="theme-toggle" onclick="toggleTheme()" title="Toggle Night Mode">
                <span class="toggle-icon">🌙</span>
                <div class="toggle-switch"></div>
            </div>
        </div>

        <!-- Main Card -->
        <div class="card">
            <!-- Search Section -->
            <div class="search-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput" 
                        placeholder="Enter phone number (e.g., 03174433108) or CNIC (e.g., 3540219455089)"
                        autocomplete="off"
                    >
                </div>
                <button class="search-btn" id="searchBtn" onclick="performSearch()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>Search Database</span>
                </button>
                <div class="error-message" id="errorMessage"></div>
            </div>

            <!-- Results Section -->
            <div class="results-section" id="resultsSection">
                <div class="results-header">
                    <span class="results-count" id="resultsCount">Found 0 records</span>
                    <div class="results-actions">
                        <span class="cached-badge" id="cachedBadge" style="display: none;">Cached</span>
                        <button class="copy-btn" id="copyBtn" onclick="copyResults()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <span>Copy Results</span>
                        </button>
                    </div>
                </div>
                
                <!-- Desktop Table View -->
                <div class="table-wrapper" id="desktopResults"></div>

                <!-- Mobile Card View -->
                <div class="mobile-results" id="mobileResults"></div>
            </div>
        </div>
    </div>

    <!-- Footer with Branding -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">
                Developed with <span class="heart">❤</span> by <span class="footer-brand">ALI RAZA</span>
            </p>
            
            <div class="branding-buttons">
                <a href="https://" target="_blank" class="brand-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M2 12h20"></path>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    Visit Website

                    </svg>
                    HACK WIZARD X Channel

                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 16.5c-.3.8-1 1.4-1.9 1.7-1.7.5-3.4.4-5.1-.1-.9-.3-1.6-.9-1.9-1.8-.4-1.1-.3-2.3.3-3.3.3-.5.8-.9 1.3-1.2-.1-.3-.2-.6-.3-.9-.1-.4 0-.8.3-1.1.3-.3.7-.4 1.1-.2.4.1.7.4.9.8.2-.1.4-.1.6-.2.5-.1 1-.1 1.5 0 .2 0 .4.1.6.2.2-.4.5-.7.9-.8.4-.2.8-.1 1.1.2.3.3.4.7.3 1.1-.1.3-.2.6-.3.9.5.3.9.7 1.3 1.2.6 1 .7 2.2.3 3.3z"/>

    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Results copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
