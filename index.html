    <meta name="theme-color" content="#00f2fe">
    <link rel="icon" href="https://i.ibb.co/C5CyZ5dY/In-Shot-20260902-111330836.jpg" type="image/jpeg">
    
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #080a10;
            --card-bg: rgba(16, 22, 36, 0.65);
            --border-color: rgba(0, 242, 254, 0.25);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --accent-pink: #ff007f;
            --text-color: #e0e6ed;
            --text-dim: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 16, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-top: 4px solid var(--primary-neon);
            border-right: 4px solid var(--accent-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .loading-text {
            margin-top: 15px;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-neon);
            letter-spacing: 2px;
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-neon), transparent);
        }

        .brand-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            margin-bottom: 12px;
            object-fit: cover;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--accent-pink);
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .pwa-btn {
            display: none;
            background: linear-gradient(135deg, var(--accent-pink), #7928ca);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
            transition: 0.3s ease;
            margin-top: 5px;
        }

        .pwa-btn i { margin-right: 6px; }

        .search-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            background: rgba(8, 10, 16, 0.7);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .input-group button {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .summary-badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--primary-neon);
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-badge div {
            font-size: 14px;
            color: #fff;
        }

        .summary-badge span {
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            color: var(--primary-neon);
            font-size: 16px;
        }

        .section-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--primary-neon);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.15);
            padding-bottom: 6px;
        }

        .data-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .operator-tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
        }

        .copy-card-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--primary-neon);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .copy-card-btn:hover {
            background: var(--primary-neon);
            color: #000;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .data-row:last-child { margin-bottom: 0; }

        .data-label {
            color: var(--text-dim);
            font-weight: 600;
            min-width: 90px;
        }

        .data-value {
            color: #fff;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-dim);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: var(--primary-neon);
            color: #000;
        }

        .error-card {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--accent-pink);
            color: #ff80bf;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .no-results {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.5);
            color: #ffc107;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .cache-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(0, 242, 254, 0.1);
            color: var(--primary-neon);
            margin-left: 10px;
        }

        /* Toast notification */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: var(--primary-neon);
            color: #000;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: fixed;
            z-index: 10000;
            bottom: 30px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        @media (max-width: 480px) {
            .input-group { flex-direction: column; }
            .input-group button { padding: 12px; }
            .data-row { flex-direction: column; align-items: flex-start; gap: 2px; }
            .data-value { text-align: left; }
        }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">SEARCHING DATABASE...</div>
</div>

<!-- Toast -->
<div id="toast">Data Copied!</div>

<div class="container">
    <!-- Header -->
    <div class="header-card">
        <img src="https://n.f-a-k.workers.dev/menu-5int.jpg" alt="RAZA Logo" class="brand-img">
        <div class="title">RAZA D3V</div>
        <div class="subtitle">NUMBER TO INFO TOOL</div>
        <button id="pwaInstallBtn" class="pwa-btn"><i class="fa-solid fa-download"></i> Install App</button>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <form id="searchForm">
            <div class="input-group">
                <input type="text" id="searchInput" name="query" placeholder="Enter Phone Number or CNIC..." required>
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>
        </form>
    </div>

    <!-- Results Section -->
    <div id="resultsSection"></div>
    
    <!-- Developer Credit -->
    <div style="text-align: center; margin-top: 20px; padding: 15px; color: var(--text-dim); font-size: 12px;">
        <i class="fa-solid fa-code"></i> API by FAIZAN AHMAD KHICI | <a href="https://faizankhichi.me" target="_blank" style="color: var(--primary-neon); text-decoration: none;">faizankhichi.me</a>
    </div>
</div>

<script>
    // Copy function
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast("Data Copied!");
        });
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // Search Form Handler
    document.getElementById('searchForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultsSection = document.getElementById('resultsSection');
        
        loadingOverlay.style.display = 'flex';
        resultsSection.innerHTML = '';
        
        try {
            const response = await fetch(`https://sim-db-api.faizankhichi.me/?search=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            if (data.ok && data.data && data.data.length > 0) {
                let html = '';
                
                // Summary badge
                html += `
                    <div class="summary-badge">
                        <div><i class="fa-solid fa-database"></i> Records Found: <span>${data.data.length}</span></div>
                        <div class="cache-badge"><i class="fa-solid fa-bolt"></i> ${data.cached === 'yes' ? 'Cached' : 'Live'}</div>
                    </div>
                `;
                
                // Results
                html += '<div class="section-header"><i class="fa-solid fa-list"></i> Search Results</div>';
                
                data.data.forEach((item, index) => {
                    html += `
                        <div class="data-card">
                            <div class="card-top-bar">
                                <span class="operator-tag">
                                    <i class="fa-solid fa-sim-card"></i> Record #${index + 1}
                                </span>
                                <button class="copy-card-btn" onclick="copyCardData(${index})">
                                    <i class="fa-regular fa-copy"></i> Copy All
                                </button>
                            </div>
                            <div class="data-row">
                                <span class="data-label"><i class="fa-solid fa-phone"></i> Number:</span>
                                <span class="data-value">
                                    ${item.nbr || 'N/A'}
                                    <button class="copy-btn" onclick="copyToClipboard('${item.nbr || ''}')" title="Copy Number">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </span>
                            </div>
                            <div class="data-row">
                                <span class="data-label"><i class="fa-solid fa-user"></i> Name:</span>
                                <span class="data-value">
                                    ${item.nam || 'N/A'}
                                    <button class="copy-btn" onclick="copyToClipboard('${item.nam || ''}')" title="Copy Name">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </span>
                            </div>
                            <div class="data-row">
                                <span class="data-label"><i class="fa-solid fa-id-card"></i> CNIC:</span>
                                <span class="data-value">
                                    ${item.cni || 'N/A'}
                                    <button class="copy-btn" onclick="copyToClipboard('${item.cni || ''}')" title="Copy CNIC">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </span>
                            </div>
                            <div class="data-row" style="align-items: flex-start;">
                                <span class="data-label"><i class="fa-solid fa-location-dot"></i> Address:</span>
                                <span class="data-value" style="flex: 1; text-align: left; margin-left: 10px;">
                                    ${item.adr || 'N/A'}
                                    <button class="copy-btn" onclick="copyToClipboard('${item.adr || ''}')" title="Copy Address" style="flex-shrink: 0;">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </span>
                            </div>
                        </div>
                    `;
                });
                
                resultsSection.innerHTML = html;
                
                // Store data for copy function
                window.searchResults = data.data;
            } else {
                resultsSection.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-circle-exclamation"></i> No records found for "${query}"
                    </div>
                `;
            }
        } catch (error) {
            resultsSection.innerHTML = `
                <div class="error-card">
                    <i class="fa-solid fa-triangle-exclamation"></i> Error fetching data. Please try again later.<br>
                    <small style="opacity: 0.7;">${error.message}</small>
                </div>
            `;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    });

    // Copy all card data
    function copyCardData(index) {
        if (window.searchResults && window.searchResults[index]) {
            const item = window.searchResults[index];
            const text = `Number: ${item.nbr || 'N/A'}\nName: ${item.nam || 'N/A'}\nCNIC: ${item.cni || 'N/A'}\nAddress: ${item.adr || 'N/A'}`;
            copyToClipboard(text);
        }
    }

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl)
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.error('SW Error:', err));
    }

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            });
        }
    });
</script>

</body>
</html>
